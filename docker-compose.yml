services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: service_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mock-services:
    build:
      context: ./mock-services
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/service_monitor
      NODE_ENV: production
      # Poller
      POLL_INTERVAL_MS: 30000
      CHECK_TIMEOUT_MS: 3000
      CONCURRENCY_LIMIT: 10
      # Alerting
      ALERT_THRESHOLD: 3
      # ALERT_WEBHOOK_URL: ""
      # Retention
      RETENTION_DAYS: 7
      MAX_CHECKS_PER_SERVICE: 500
      # AI incident summary (reads from host .env)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      mock-services:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
