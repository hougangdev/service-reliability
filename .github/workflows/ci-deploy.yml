name: CI + Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:run
      - run: npm run build

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push mock-services image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
                        -t $ECR_REGISTRY/service-monitor/mock-services:$IMAGE_TAG \
                        -t $ECR_REGISTRY/service-monitor/mock-services:latest \
                        ./mock-services
          docker push $ECR_REGISTRY/service-monitor/mock-services:$IMAGE_TAG
          docker push $ECR_REGISTRY/service-monitor/mock-services:latest

      - name: Build and push web image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
                        -t $ECR_REGISTRY/service-monitor/web:$IMAGE_TAG \
                        -t $ECR_REGISTRY/service-monitor/web:latest \
                        --target runner \
                        .
          docker push $ECR_REGISTRY/service-monitor/web:$IMAGE_TAG
          docker push $ECR_REGISTRY/service-monitor/web:latest

      # Terraform updates both image references and env vars in one apply
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="ecr_web_url=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/service-monitor/web" \
            -var="ecr_mock_services_url=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/service-monitor/mock-services" \
            -var="anthropic_api_key=${{ secrets.ANTHROPIC_API_KEY }}"
